# MxM Kitty Theme (v1.2, strict mapping)
# Applies the MxM Core Palette to the ANSI 16-color space.

foreground            #EFEFEF
background            #0D171D

# Cursor
cursor                #E3C98A
cursor_text_color     #0D171D

# Selection
selection_background  #20323A
selection_foreground  #EFEFEF

# URL underline color
url_color             #3557A0

##############
# Normal ANSI
##############

# 0: black      → bg0
color0  #0D171D

# 1: red        → alert
color1  #8D1714

# 2: green      → ok (we do not use literal green)
color2  #C8A97B

# 3: yellow     → info/active
color3  #E3C98A

# 4: blue       → accent_blue
color4  #3557A0

# 5: magenta    → also accent_blue (no magenta in MxM)
color5  #3557A0

# 6: cyan       → structural_blue
color6  #42565A

# 7: white      → neutral
color7  #AAB1A4

################
# Bright ANSI
################

# 8: bright black → bg2
color8  #1F2E34

# 9: bright red   → slightly lighter alert
color9  #A61E1B

# 10: bright green → slightly lighter ok
color10 #D7C2A0

# 11: bright yellow → slightly lighter info
color11 #F1DFAA

# 12: bright blue → slightly lighter accent_blue
color12 #4068BA

# 13: bright magenta → same as bright blue (we have no magenta)
color13 #4068BA

# 14: bright cyan → slightly lighter structural_blue
color14 #4A6970

# 15: bright white → text_primary
color15 #EFEFEF
