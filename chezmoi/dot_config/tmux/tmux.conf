# MXM tmux configuration
# Managed by mxm-workstation via chezmoi.

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Pane navigation
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-j select-pane -D
bind -n C-k select-pane -U

# Mouse support
set -g mouse on

# Indices
set -g base-index 1
setw -g pane-base-index 1

# Status bar
set -g status-position top
set -g status-style "bg=#0D171D,fg=#AAB1A4"
set -g status-left "#[fg=#E3C98A,bold] #S #[fg=#42565A]|"
set -g status-right "#[fg=#42565A]%Y-%m-%d #[fg=#E3C98A]%H:%M "
set -g window-status-current-style "fg=#EFEFEF,bg=#1F2E34,bold"
set -g window-status-style "fg=#AAB1A4,bg=#0D171D"
set -g pane-border-style "fg=#1F2E34"
set -g pane-active-border-style "fg=#E3C98A"

# Clipboard
set -s set-clipboard external
set -as terminal-features ',xterm-kitty:clipboard'
