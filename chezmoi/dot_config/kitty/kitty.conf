# MXM Kitty Configuration
#
# Managed by mxm-workstation via chezmoi.
# Live path: ~/.config/kitty/kitty.conf

# Theme
include ./mxm.conf

# Font settings
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Window behaviour
hide_window_decorations yes
background_opacity 1

# Key mappings
# Launch new tmux-backed shell in the current working directory.
# TODO: Add ~/bin/tmux-launch.sh to mxm-workstation or replace with direct tmux command.
map ctrl+shift+t launch --cwd=window bash -c "~/bin/tmux-launch.sh"

# UK keyboard workaround: map Alt+3 to '#'.
map alt+3 #
