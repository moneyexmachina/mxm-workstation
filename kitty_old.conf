# Load Catppuccin base theme (choose one: latte, frappe, macchiato, mocha)
include ./mxm.conf

# Font settings
font_family	FiraCode Nerd Font
bold_font	auto
italic_font	auto
font_size	14.0


# BEGIN_KITTY_FONTS
#  font_family      family="Menlo"
 #   bold_font        auto
 #   italic_font      auto
 #   bold_italic_font auto
# END_KITTY_FONTS

map crtl+shift+t launch --cwd=window bash -c "~/bin/tmux-launch.sh"
map alt+3 #
hide_window_decorations yes
background_opacity 1
